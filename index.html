<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPCO ROSTER V101 - Original Login Clean</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: Arial Black, sans-serif; background: #f5f5f5; }

/* ORIGINAL LOGIN - V48 REPCO STYLE - No card, clean fields, red/black corners */
#custom-login-page {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  background: white;
  z-index: 99999;
  display: none;
  overflow: hidden;
  font-family: 'Arial Black', 'Baloo 2', Impact, sans-serif;
}
#custom-login-page .red-corner {
  position: absolute;
  top: 0;
  left: 0;
  width: 26vw;
  max-width: 320px;
  height: 42vh;
  max-height: 520px;
  background: #E30613;
  clip-path: polygon(0 0, 100% 0, 0 100%);
  z-index: 1;
}
#custom-login-page .black-corner {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 26vw;
  max-width: 320px;
  height: 42vh;
  max-height: 520px;
  background: #0a0a0a;
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
  z-index: 1;
}
#custom-login-page .login-center {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  min-height: 100vh;
  padding: 60px 20px 20px;
  padding-top: 12vh;
}
.repco-logo-v2 {
  display: flex;
  align-items: center;
  margin-bottom: 36px;
}
.repco-stripes-v2 {
  display: flex;
  gap: 7px;
  margin-right: 14px;
}
.repco-stripe-v2 {
  background: #E30613;
  transform: skewX(-18deg);
  height: 46px;
}
.repco-stripe-v2.s1 { width: 52px; }
.repco-stripe-v2.s2 { width: 20px; }
.repco-stripe-v2.s3 { width: 20px; }
.repco-stripe-v2.s4 { width: 11px; }
.repco-stripe-v2.s5 { width: 7px; }
.repco-text-v2 {
  font-family: 'Arial Black', Impact, sans-serif;
  font-size: 62px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: -1px;
  line-height: 1;
  color: #0a0a0a;
  transform: skewX(-10deg);
  margin-left: 2px;
}
.repco-title-v2 {
  font-family: 'Arial Black', sans-serif;
  font-weight: 900;
  font-size: 26px;
  letter-spacing: 1px;
  color: #0a0a0a;
  margin-bottom: 48px;
  text-align: center;
}
.repco-form-v2 {
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}
.repco-row-v2 {
  display: flex;
  align-items: center;
  gap: 16px;
  width: 100%;
  justify-content: center;
}
.repco-row-v2 label {
  font-family: 'Arial Black', sans-serif;
  font-weight: 900;
  font-size: 17px;
  color: #0a0a0a;
  min-width: 130px;
  text-align: right;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}
.repco-input-v2 {
  flex: 1;
  max-width: 300px;
  background: #C4C4C4;
  border: none;
  border-radius: 9999px;
  padding: 14px 22px;
  font-size: 15px;
  font-weight: 600;
  color: #111;
  outline: none;
  height: 44px;
}
.repco-input-v2:focus {
  background: #B8B8B8;
  box-shadow: 0 0 0 3px #111;
}
.repco-signin-v2 {
  background: #C4C4C4;
  border: none;
  border-radius: 9999px;
  padding: 14px 48px;
  font-family: 'Arial Black', sans-serif;
  font-weight: 900;
  font-size: 18px;
  letter-spacing: 1px;
  color: #0a0a0a;
  cursor: pointer;
  margin-top: 12px;
  min-width: 300px;
  max-width: 400px;
  height: 48px;
  transition: all 0.2s;
}
.repco-signin-v2:hover {
  background: #0a0a0a;
  color: white;
  transform: translateY(-2px);
  box-shadow: 0 4px 0px #E30613;
}
#custom-error-v2 {
  background: #FF4B4B;
  color: white;
  border: 2.5px solid #111;
  border-radius: 9999px;
  padding: 10px 20px;
  font-weight: 800;
  font-size: 13px;
  text-align: center;
  margin-top: 12px;
  display: none;
  max-width: 400px;
  width: 100%;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* APP STYLES */
.r-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: white;
  border-bottom: 3px solid #111;
  position: sticky;
  top: 0;
  z-index: 1000;
}
.r-title { font-weight: 900; font-size: 22px; }
.r-title span { color: #E30613; }
.r-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.r-btn {
  background: #D9D9D9;
  border: none;
  border-radius: 9999px;
  padding: 10px 18px;
  font-family: 'Arial Black', sans-serif;
  font-weight: 900;
  font-size: 12px;
  cursor: pointer;
  position: relative;
}
.r-btn.active { background: #111; color: white; box-shadow: 3px 3px 0px #888; }
.r-btn:hover { background: #111; color: white; }
.r-btn .notif-count {
  position: absolute;
  top: -8px;
  right: -8px;
  background: #E30613;
  color: white;
  border-radius: 9999px;
  font-size: 9px;
  font-weight: 900;
  padding: 2px 6px;
  min-width: 18px;
  text-align: center;
  display: none;
  border: 2px solid white;
}
.r-btn .notif-count.show { display: block; }
.page { display: none; background: white; min-height: 100vh; }
.page.show { display: block !important; }
#roster-page { display: block; }
.red-corner-app { position: absolute; top:0; left:0; width: 280px; height: 380px; background: #E30613; clip-path: polygon(0 0, 100% 0, 0 100%); z-index:1; pointer-events:none; }
.black-corner-app { position: absolute; bottom:0; right:0; width: 280px; height: 380px; background: #0a0a0a; clip-path: polygon(100% 0, 100% 100%, 0 100%); z-index:1; pointer-events:none; }
.options-title { position: relative; z-index:2; text-align: center; font-weight: 900; font-size: 32px; margin: 40px 0 50px; }
.options-grid { position: relative; z-index:2; max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 0 20px 80px; }
.opt-btn { background: #D9D9D9; border: none; border-radius: 9999px; padding: 14px 18px; font-weight: 900; font-size: 12px; text-align: left; cursor: pointer; line-height:1.2; }
.opt-btn:hover { background: #111; color: white; transform: translateY(-2px); box-shadow: 3px 3px 0 #111; }
.r-table-wrap { padding: 20px; overflow-x: auto; }
.r-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.r-table th, .r-table td { border: 2.5px solid #111; padding: 6px 8px; text-align: center; }
.r-table th { background: #111; color: white; font-weight: 900; }
.r-table td { background: white; }
.r-table td.off { background: #EEE; color: #888; }
.r-table td.abs { background: #FFCDD2 !important; color: #B71C1C !important; font-weight: 900; border: 2px solid #B71C1C !important; }
.toggle-wrap { padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toggle-btn { background: #D9D9D9; border: 2.5px solid #111; border-radius: 9999px; padding: 8px 14px; font-weight: 900; font-size: 11px; cursor: pointer; }
.toggle-btn.active { background: #111; color: white; }
.requests-content { padding: 20px; max-width: 1000px; margin: 0 auto; position: relative; z-index: 2; }
.req-card { background: white; border: 2.5px solid #111; border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.req-card.new { border-color: #E30613; box-shadow: 3px 3px 0 #E30613; }
.req-form { background: white; border: 3px solid #111; border-radius: 16px; padding: 16px; margin-bottom: 20px; box-shadow: 4px 4px 0 #111; }
.req-input { border: 2.5px solid #111; border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 12px; width: 100%; margin-bottom: 8px; }
.btn-black { background: #111; color: white; border: 2.5px solid #111; border-radius: 9999px; padding: 10px 18px; font-weight: 900; font-size: 11px; cursor: pointer; }
.btn-grey { background: #D9D9D9; border: 2.5px solid #111; border-radius: 9999px; padding: 10px 18px; font-weight: 900; font-size: 11px; cursor: pointer; }
.role-badge { background: #111; color: white; border-radius: 9999px; padding: 4px 10px; font-size: 10px; font-weight: 900; }
.role-badge.manager { background: #E30613; }
.live-dot { display: inline-block; width: 10px; height: 10px; background: #E30613; border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%{ transform:scale(1); } 50%{ transform:scale(1.3); } 100%{ transform:scale(1); } }
@media (max-width: 600px) {
  .repco-logo-v2 { transform: scale(0.8); margin-bottom: 28px; }
  .repco-text-v2 { font-size: 48px; }
  .repco-title-v2 { font-size: 20px; margin-bottom: 36px; }
  .repco-row-v2 { flex-direction: column; gap: 6px; align-items: flex-start; }
  .repco-row-v2 label { text-align: left; min-width: auto; font-size: 15px; }
  .repco-input-v2 { max-width: 100%; width: 100%; }
  .repco-signin-v2 { min-width: 100%; max-width: 100%; }
  #custom-login-page .login-center { padding-top: 8vh; }
  .options-grid { grid-template-columns: 1fr; }
}

.r-table-wrap-v106 {
  overflow: auto;
  max-width: 100%;
  background: white;
}
.r-table-v106 {
  width: max-content;
  min-width: 100%;
  border-collapse: collapse;
  font-family: Arial, sans-serif;
}
.r-table-v106 th {
  background: #FFE6A0;
  border: 1.5px solid #0a0a0a;
  padding: 6px 4px;
  font-family: 'Arial Black', sans-serif;
  font-weight: 900;
  font-size: 10px;
  text-align: center;
  white-space: nowrap;
  min-width: 85px;
  height: 38px;
}
.r-table-v106 th:first-child {
  min-width: 155px;
  max-width: 155px;
  width: 155px;
  text-align: left;
  padding-left: 8px;
  position: sticky;
  left: 0;
  z-index: 4;
  background: #FFE6A0;
}
.r-table-v106 th.weekend { background: #90CAF9 !important; }
.r-table-v106 td {
  border: 1.5px solid #666;
  padding: 0;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  height: 36px;
  background: white;
  white-space: nowrap;
}
.r-table-v106 td:first-child {
  min-width: 155px;
  max-width: 155px;
  width: 155px;
  text-align: left;
  padding-left: 8px;
  position: sticky;
  left: 0;
  z-index: 3;
  background: white;
  font-family: 'Arial Black', sans-serif;
  font-size: 11px;
  white-space: nowrap;
  overflow: hidden;
}
.r-table-v106 td.off { background: #BDBDBD !important; color: #444 !important; }
.r-table-v106 td.weekend { background: #BBDEFB !important; }
.r-table-v106 td.weekend.off { background: #9E9E9E !important; }
.r-table-v106 td.abs { background: #FFCDD2 !important; color: #B71C1C !important; font-weight: 900; border: 2px solid #B71C1C !important; }
.r-table-v106 .cell-inner { padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.r-table-v106 .ab-badge { background: #111; color: #fff; border-radius: 4px; padding: 1px 4px; font-size: 8px; font-weight: 900; }
.user-bar-v106 {
  background: #111;
  color: white;
  padding: 8px 20px;
  font-family: 'Arial Black', sans-serif;
  font-weight: 900;
  font-size: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.user-bar-v106 .welcome { animation: fadeOutV106 1s forwards; animation-delay: 3s; }
@keyframes fadeOutV106 { to { opacity: 0; transform: translateY(-10px); } }
.user-bar-v106 .current-user { background: #E30613; padding: 4px 10px; border-radius: 9999px; font-size: 11px; }
.toast-v106 {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #111;
  color: white;
  padding: 12px 20px;
  border-radius: 9999px;
  font-weight: 900;
  font-size: 12px;
  z-index: 99999;
  display: none;
  box-shadow: 4px 4px 0 #E30613;
  max-width: 90%;
  text-align: center;
  font-family: 'Arial Black', sans-serif;
}
.toast-v106.show { display: block; }
.fort-select-v106 { border:2.5px solid #111; border-radius:10px; padding:6px 10px; font-weight:800; font-size:11px; font-family:'Arial Black', sans-serif; }
.section-title-v106 { font-family:'Arial Black', sans-serif; font-weight:900; font-size:14px; background:#111; color:white; padding:8px 12px; border-radius:8px; margin:16px 0 8px; }

</style>
</head>
<body>

<!-- ORIGINAL LOGIN - Clean, no CSS leaking -->
<div id="custom-login-page">
  <div class="red-corner"></div>
  <div class="black-corner"></div>
  <div class="login-center">
    <div class="repco-logo-v2">
      <div class="repco-stripes-v2">
        <div class="repco-stripe-v2 s1"></div>
        <div class="repco-stripe-v2 s2"></div>
        <div class="repco-stripe-v2 s3"></div>
        <div class="repco-stripe-v2 s4"></div>
        <div class="repco-stripe-v2 s5"></div>
      </div>
      <div class="repco-text-v2">Repco</div>
    </div>
    <div class="repco-title-v2">REPCO ROSTER</div>
    <div class="repco-form-v2">
      <div class="repco-row-v2">
        <label>USERNAME:</label>
        <input id="custom-username" class="repco-input-v2" type="text" autocomplete="username" placeholder="">
      </div>
      <div class="repco-row-v2">
        <label>PASSWORD:</label>
        <input id="custom-password" class="repco-input-v2" type="password" autocomplete="current-password" placeholder="">
      </div>
      <button id="custom-signin" class="repco-signin-v2">SIGN IN</button>
      <div id="custom-error-v2"></div>
    </div>
  </div>
</div>

<!-- ROSTER PAGE -->
<div id="roster-page" class="page">
  <div class="r-header">
    <div class="r-title"><span>REPCO</span> ROSTER</div>
    <div class="r-btns">
      <button class="r-btn active" onclick="nav('roster')">ROSTER</button>
      <button class="r-btn" onclick="nav('requests')">REQUESTS <span class="notif-count" id="notif-roster"></span></button>
      <button class="r-btn" onclick="nav('options')">OPTIONS</button>
      <button class="r-btn" onclick="nav('logout')">LOG OUT</button>
    </div>
  </div>
  
  <div class="user-bar-v106" id="user-bar-v106">
    <div class="welcome" id="welcome-msg-v106">Welcome Chris</div>
    <div class="current-user" id="current-user-v106">Chris - Full Time</div>
  </div>

  <div class="toggle-wrap">
    <button id="btn-12h" class="toggle-btn" onclick="setTimeMode('12h')">12H</button>
    <button id="btn-24h" class="toggle-btn active" onclick="setTimeMode('24h')">24H</button>
    <span style="margin-left:20px; font-size:12px; font-weight:700;" id="fort-label">FORTNIGHT: 07/10 TO 20/10 | DEVICE: --:-- (Brisbane +10)</span>
    
    <select id="fort-select-v106" class="fort-select-v106" onchange="changeFortnightV106()">
      <option value="current">▶ CURRENT: 07/10 TO 20/10</option>
      <option value="next">Next: 21/10 TO 03/11</option>
    </select>

  </div>
  
  <div id="full-section">
    <div class="section-title-v106">FULL TIME • 8</div>
    <div class="r-table-wrap-v106">
      <table class="r-table-v106" id="roster-table-full">
        <thead id="roster-head-full"></thead>
        <tbody id="roster-body-full"></tbody>
      </table>
    </div>
  </div>
  <div id="casual-section">
    <div class="section-title-v106">CASUAL • 13 (Sample: 2 shown)</div>
    <div class="r-table-wrap-v106">
      <table class="r-table-v106" id="roster-table-casual">
        <thead id="roster-head-casual"></thead>
        <tbody id="roster-body-casual"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- REQUESTS PAGE -->
<div id="requests-page" class="page">
  <div class="r-header">
    <div class="r-title"><span>REPCO</span> ROSTER</div>
    <div class="r-btns">
      <button class="r-btn" onclick="nav('roster')">ROSTER</button>
      <button class="r-btn active" onclick="nav('requests')">REQUESTS <span class="notif-count" id="notif-requests"></span></button>
      <button class="r-btn" onclick="nav('options')">OPTIONS</button>
      <button class="r-btn" onclick="nav('logout')">LOG OUT</button>
    </div>
  </div>
  <div class="requests-content">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <h2 style="font-weight:900; margin:0;">REQUESTS <span id="role-display" class="role-badge">EMPLOYEE</span></h2>
      <div id="notif-banner" style="display:none; background:#E30613; color:white; border-radius:9999px; padding:6px 12px; font-size:11px; font-weight:900;"><span class="live-dot"></span><span id="notif-text">New</span></div>
    </div>
    <div id="manager-stats" style="display:none; margin:16px 0; background:#111; color:white; border-radius:12px; padding:12px; display:flex; gap:16px; flex-wrap:wrap;">
      <div><b id="stat-pending">0</b> Pending</div>
      <div><b id="stat-new">0</b> New</div>
      <div><b id="stat-approved">0</b> Approved</div>
      <div><b id="stat-denied">0</b> Denied</div>
    </div>
    <div id="employee-form" class="req-form">
      <div style="font-weight:900; margin-bottom:10px;">Create Request</div>
      <select id="req-type" class="req-input">
        <option value="leave">Leave Request</option>
        <option value="swap">Shift Swap</option>
        <option value="unavailable">Unavailable</option>
        <option value="sick">Sick Leave</option>
      </select>
      <input id="req-date" class="req-input" type="date">
      <input id="req-reason" class="req-input" placeholder="Reason">
      <div style="display:flex; gap:8px;">
        <button class="btn-black" onclick="createRequest()">Submit</button>
        <button class="btn-grey" onclick="clearMyRequests()">Clear Mine</button>
      </div>
    </div>
    <div id="manager-controls" style="display:none; margin-bottom:16px; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn-black" onclick="filterRequests('all')">All</button>
      <button class="btn-grey" onclick="filterRequests('pending')">Pending</button>
      <button class="btn-grey" onclick="filterRequests('new')">New / Not Actioned</button>
      <button class="btn-grey" onclick="markAllRead()">Mark All Read</button>
    </div>
    <div id="requests-list"></div>
  </div>
</div>

<!-- OPTIONS PAGE -->
<div id="options-page" class="page">
  <div class="red-corner-app"></div>
  <div class="black-corner-app"></div>
  <div class="r-header">
    <div class="r-title"><span>REPCO</span> ROSTER</div>
    <div class="r-btns">
      <button class="r-btn" onclick="nav('roster')">ROSTER</button>
      <button class="r-btn" onclick="nav('requests')">REQUESTS <span class="notif-count" id="notif-options"></span></button>
      <button class="r-btn active" onclick="nav('options')">OPTIONS</button>
      <button class="r-btn" onclick="nav('logout')">LOG OUT</button>
    </div>
  </div>
  <div class="options-title">OPTIONS</div>
  <div class="options-grid">
    <button class="opt-btn" onclick="showTodayWorkers()">VIEW TODAY'S<br>WORKERS</button>
    <button class="opt-btn" onclick="alert('EXCEL EXPORT')">EXCEL EXPORT</button>
    <button class="opt-btn" onclick="alert('PDF EXPORT')">PDF EXPORT</button>
    <button class="opt-btn" onclick="alert('HIDDEN EMPLOYEES')">HIDDEN<br>EMPLOYEES</button>
    <button class="opt-btn" onclick="alert('IMPORT ROSTER')">IMPORT ROSTER</button>
    <button class="opt-btn" onclick="alert('DUPLICATE ROSTER')">DUPLICATE ROSTER</button>
    <button class="opt-btn" onclick="alert('ARCHIVE')">ARCHIVE</button>
    <button class="opt-btn" onclick="alert('DELETE ROSTER')">DELETE ROSTER</button>
    <button class="opt-btn" onclick="alert('CUSTOM ROSTERS')">CUSTOM ROSTERS</button>
    <button class="opt-btn" onclick="alert('ALL ACCOUNT MANAGEMENT')">ALL ACCOUNT<br>MANAGEMENT</button>
  </div>
</div>

<script>
let timeMode = localStorage.getItem('repco_timeMode') || '24h';
let currentRole = localStorage.getItem('repco_currentRole') || 'employee';
let sampleDates = [
  {day:'MON', date:'07/10'}, {day:'TUE', date:'08/10'}, {day:'WED', date:'09/10'}, {day:'THU', date:'10/10'},
  {day:'FRI', date:'11/10'}, {day:'SAT', date:'12/10'}, {day:'SUN', date:'13/10'},
  {day:'MON', date:'14/10'}, {day:'TUE', date:'15/10'}, {day:'WED', date:'16/10'}, {day:'THU', date:'17/10'},
  {day:'FRI', date:'18/10'}, {day:'SAT', date:'19/10'}, {day:'SUN', date:'20/10'}
];

function isManagerRole(){ return ['manager','master','admin'].includes(currentRole); }
function formatTime(t){
  if(timeMode==='24h') return t;
  if(!t || t==='OFF') return t;
  let hasAB = t.includes('AB');
  let clean = t.replace(' AB','').replace('AB','').trim();
  if(!clean.includes('-')) return t;
  let parts = clean.split('-');
  let s = convert(parts[0].trim());
  let e = convert(parts[1].trim());
  let res = s + ' - ' + e;
  if(hasAB) res += ' AB';
  return res;
}
function convert(hm){
  let [h,m] = hm.split(':').map(Number);
  if(isNaN(h)) return hm;
  let ampm = h>=12 ? 'PM' : 'AM';
  let h12 = h%12; if(h12===0) h12=12;
  return h12 + ':' + String(m).padStart(2,'0') + ' ' + ampm;
}

function createRequest(){

function actionReqById(id, status){
  let list=JSON.parse(localStorage.getItem('repco_requests')||'[]');
  let item=list.find(r=>r.id===id);
  if(item){ item.status=status; item.isNew=false; item.isRead=true; localStorage.setItem('repco_requests', JSON.stringify(list)); renderRequests(); updateNotif(); }
}
function deleteReqById(id){
  if(!confirm('Delete?')) return;
  let list=JSON.parse(localStorage.getItem('repco_requests')||'[]');
  list=list.filter(r=>r.id!==id);
  localStorage.setItem('repco_requests', JSON.stringify(list));
  renderRequests(); updateNotif();
}

function getBrisbaneNow(){ return new Date(); }
function parseShiftTimeV106(timeStr){
  if(!timeStr || timeStr==='OFF') return null;
  if(timeStr.toUpperCase().indexOf('ABSENT')>-1) return null;
  let clean = timeStr.replace(/AB/g, '').trim();
  if(clean.indexOf('-')===-1) return null;
  let parts = clean.split('-');
  function toMin(t){
    let m = t.match(/([0-9]+):([0-9]+)/);
    if(!m) return null;
    return parseInt(m[1])*60+parseInt(m[2]);
  }
  return {end: toMin(parts[1])};
}
function isShiftWorkedV106(dateStr, timeStr, now){
  if(!timeStr || timeStr==='OFF') return false;
  if(timeStr.toUpperCase().indexOf('AB')>-1) return false;
  let parsed = parseShiftTimeV106(timeStr);
  if(!parsed || parsed.end===null) return false;
  let dm = dateStr.split('/');
  if(dm.length!==2) return false;
  let day=parseInt(dm[0]), month=parseInt(dm[1]);
  let year=now.getFullYear();
  let shiftDate=new Date(year, month-1, day);
  let today=new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let shiftDay=new Date(shiftDate.getFullYear(), shiftDate.getMonth(), shiftDate.getDate());
  if(shiftDay.getTime() < today.getTime()) return true;
  if(shiftDay.getTime() > today.getTime()) return false;
  let nowMin=now.getHours()*60+now.getMinutes();
  return nowMin >= parsed.end;
}

  } else if(page==='options'){
    document.getElementById('custom-login-page').style.display='none';
    document.body.style.overflow='auto';
    document.getElementById('roster-page').classList.remove('show'); 
    document.getElementById('roster-page').style.display='none';
    document.getElementById('requests-page').classList.remove('show'); 
    document.getElementById('requests-page').style.display='none';
    document.getElementById('options-page').classList.add('show'); 
    document.getElementById('options-page').style.display='block';
  } else if(page==='logout'){
    let uEl=document.getElementById('custom-username');
    let pEl=document.getElementById('custom-password');
    if(uEl) uEl.value='';
    if(pEl) pEl.value='';
    let err=document.getElementById('custom-error-v2');
    if(err) err.style.display='none';
    let btn=document.getElementById('custom-signin');
    if(btn){ btn.textContent='SIGN IN'; btn.style.background='#C4C4C4'; btn.style.color='#0a0a0a'; }
    try{ localStorage.removeItem('retail_roster_session_v1'); }catch(e){}
    document.getElementById('custom-login-page').style.display='block';
    document.body.style.overflow='hidden';
    document.getElementById('roster-page').style.display='none';
    document.getElementById('requests-page').style.display='none';
    document.getElementById('options-page').style.display='none';
    showToastV106('Logged out - username/password cleared');
  }
}
</script>

</body>
</html>
