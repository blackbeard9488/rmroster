  <script id="rm-site-tools">
  /* Site tools (manager/admin/master only): export the site file and restore previous builds. */
  (function(){
    var SITE_ID="9fb874aa-b517-4feb-bd6f-80023fe18772";
    var API="https://api.netlify.com/api/v1";
    var TOKEN_KEY="rmNetlifyToken";
    var MANAGER_ROLES=["master","manager","admin"];
    var root=null;

    function el(tag,attrs,kids){
      var n=document.createElement(tag);
      for(var k in (attrs||{})){
        if(k==="style")n.style.cssText=attrs[k];
        else if(k.slice(0,2)==="on")n.addEventListener(k.slice(2),attrs[k]);
        else if(k==="text")n.textContent=attrs[k];
        else n.setAttribute(k,attrs[k]);
      }
      (kids||[]).forEach(function(c){if(c)n.appendChild(typeof c==="string"?document.createTextNode(c):c);});
      return n;
    }
    var BTN="font-family:inherit;font-weight:800;font-size:14px;border:2.5px solid #111;border-radius:12px;padding:8px 12px;box-shadow:3px 3px 0 #111;cursor:pointer;color:#111;";
    function btn(label,bg,onclick){return el("button",{type:"button",style:BTN+"background:"+bg+";",onclick:onclick,text:label});}
    function card(kids){return el("div",{style:"border:2.5px solid #111;border-radius:16px;padding:14px;margin-top:12px;background:#fff;box-shadow:4px 4px 0 #111;"},kids);}
    function h(t){return el("div",{style:"font-weight:800;font-size:18px;color:#111;",text:t});}
    function p(t){return el("div",{style:"font-size:13px;font-weight:600;color:rgba(17,17,17,.7);margin-top:4px;",text:t});}
    function stamp(){var d=new Date();function z(n){return String(n).padStart(2,"0");}return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"_"+z(d.getHours())+z(d.getMinutes());}
    function saveFile(name,text){
      var url=URL.createObjectURL(new Blob([text],{type:"text/html"}));
      var a=el("a",{href:url,download:name});document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},2000);
    }
    function getCurrentSource(){
      return fetch(location.origin+"/",{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text();});
    }
    function copy(text){
      if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text);
      var t=el("textarea",{style:"position:fixed;opacity:0;"});t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();return Promise.resolve();
    }
    var META_PROMPT=
      "I'm attaching the complete source of my staff roster website \"Retail Roster\" as one self-contained HTML file (index.html). "+
      "It's a React app compiled into a single file: all the CSS, JavaScript and roster data are inside it, and there's no build step. "+
      "Please make the change I describe below, keep everything else exactly as it is, and give me back the complete updated index.html file "+
      "so I can upload it to Netlify (Deploys > drag and drop).\n\nChange I want:\n";

    function close(){if(root){root.remove();root=null;}document.removeEventListener("keydown",onKey);}
    function onKey(e){if(e.key==="Escape")close();}

    function exportSection(){
      var status=p("");
      function run(fn,okMsg){
        status.textContent="Working…";
        getCurrentSource().then(fn).then(function(){status.textContent=okMsg;}).catch(function(err){status.textContent="Couldn't get the site file: "+err.message;});
      }
      return card([
        h("📦 Export website"),
        p("Downloads the complete website as one index.html file. Open or upload it in Meta AI (or any AI/code editor), ask for changes, then drag the updated file onto Netlify (Deploys page) to publish."),
        el("div",{style:"display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"},[
          btn("⬇️ Download site file","#FFE066",function(){run(function(src){saveFile("rmroster-site_"+stamp()+".html",src);},"Downloaded. Find it in your Downloads folder.");}),
          btn("📋 Copy code","#A8D8FF",function(){run(function(src){return copy(src);},"Code copied. Paste it into Meta AI.");}),
          btn("✨ Copy Meta AI prompt","#B8F2C9",function(){status.textContent="";copy(META_PROMPT).then(function(){status.textContent="Prompt copied. Paste it into Meta AI, add the change you want, and attach the site file.";});})
        ]),
        status,
        p("Note: the file holds the roster as it was last published. Changes made in the app since the page was loaded (imports, edits) are not saved into it.")
      ]);
    }

    function buildsSection(){
      var list=el("div",{style:"margin-top:10px;"});
      var status=p("");
      var input=el("input",{type:"password",placeholder:"Netlify personal access token",autocomplete:"off",style:"width:100%;font-family:inherit;font-weight:700;font-size:14px;border:2.5px solid #111;border-radius:12px;padding:8px 10px;margin-top:10px;"});
      input.value=localStorage.getItem(TOKEN_KEY)||"";
      var remember=el("input",{type:"checkbox"});remember.checked=!!localStorage.getItem(TOKEN_KEY);

      function api(path,opts){
        opts=opts||{};
        opts.headers={"Authorization":"Bearer "+input.value.trim(),"Content-Type":"application/json"};
        return fetch(API+path,opts).then(function(r){
          if(r.status===401)throw new Error("token not accepted. Check it was copied correctly.");
          if(r.status===403||r.status===404)throw new Error("this token doesn't have access to the rmroster project.");
          if(!r.ok)throw new Error("Netlify returned HTTP "+r.status);
          return r.json();
        });
      }
      function fmt(iso){try{return new Date(iso).toLocaleString(undefined,{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return iso;}}

      function load(){
        if(!input.value.trim()){status.textContent="Enter your Netlify token first.";return;}
        if(remember.checked)localStorage.setItem(TOKEN_KEY,input.value.trim());else localStorage.removeItem(TOKEN_KEY);
        status.textContent="Loading builds…";list.textContent="";
        Promise.all([api("/sites/"+SITE_ID),api("/sites/"+SITE_ID+"/deploys?per_page=50")]).then(function(res){
          var liveId=res[0].published_deploy&&res[0].published_deploy.id;
          var deploys=res[1].filter(function(d){return d.state==="ready"&&d.context==="production";});
          status.textContent=deploys.length?deploys.length+" published builds found (newest first).":"No previous builds found.";
          deploys.forEach(function(d){list.appendChild(row(d,d.id===liveId));});
        }).catch(function(err){status.textContent="Couldn't load builds: "+err.message;});
      }

      function row(d,isLive){
        var title=d.title||d.commit_message||"Untitled build";
        var info=el("div",{style:"flex:1;min-width:180px;"},[
          el("div",{style:"font-weight:800;font-size:14px;color:#111;word-break:break-word;",text:title}),
          el("div",{style:"font-size:12px;font-weight:700;color:rgba(17,17,17,.6);",text:fmt(d.published_at||d.created_at)})
        ]);
        var actions=el("div",{style:"display:flex;flex-wrap:wrap;gap:6px;align-items:center;"},[
          isLive?el("span",{style:"background:#B8F2C9;border:2px solid #111;border-radius:999px;padding:2px 10px;font-weight:800;font-size:12px;",text:"LIVE NOW"}):null,
          btn("👀 View","#fff",function(){window.open(d.links&&d.links.permalink||("https://"+d.id+"--rmroster.netlify.app"),"_blank","noopener");}),
          btn("⬇️ Download","#FFE066",function(){location.href="/api/build-file?deploy="+encodeURIComponent(d.id);}),
          isLive?null:btn("⏪ Restore","#FF9AA2",function(){restore(d,title);})
        ]);
        return el("div",{style:"display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:2px dashed rgba(17,17,17,.2);padding:10px 0;"},[info,actions]);
      }

      function restore(d,title){
        var ok=confirm("Make this build the live website?\n\n\""+title+"\"\n"+fmt(d.published_at||d.created_at)+
          "\n\nEveryone will see this version straight away. Builds from before this tool was added won't have the Site tools button, so to undo you'd use the Netlify dashboard (Deploys > pick a build > Publish deploy). A new edit or deploy will replace it.");
        if(!ok)return;
        status.textContent="Restoring…";
        api("/sites/"+SITE_ID+"/deploys/"+d.id+"/restore",{method:"POST"}).then(function(){
          status.textContent="Restored. Reloading to show that version…";
          setTimeout(function(){location.reload();},1500);
        }).catch(function(err){status.textContent="Restore failed: "+err.message;});
      }

      return card([
        h("⏪ Previous builds"),
        p("Go back to an earlier published version of the website. This needs a Netlify personal access token from the account that owns the site (Netlify: User settings > Applications > Personal access tokens > New access token). The token is sent only to Netlify."),
        input,
        el("label",{style:"display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;margin-top:6px;color:#111;"},[remember,"Remember token on this device"]),
        el("div",{style:"display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"},[
          btn("🔄 Load builds","#A8D8FF",load),
          btn("Forget token","#fff",function(){localStorage.removeItem(TOKEN_KEY);input.value="";remember.checked=false;list.textContent="";status.textContent="Token removed from this device.";})
        ]),
        status,list
      ]);
    }

    window.rmOpenSiteTools=function(user){
      if(!user||MANAGER_ROLES.indexOf(user.role)<0)return;
      close();
      var panel=el("div",{role:"dialog","aria-label":"Site tools",style:"background:#FFF8E7;border:3px solid #111;border-radius:20px;box-shadow:6px 6px 0 #111;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:18px;font-family:'Baloo 2',cursive;",onclick:function(e){e.stopPropagation();}},[
        el("div",{style:"display:flex;justify-content:space-between;align-items:center;gap:8px;"},[
          el("div",{style:"font-weight:800;font-size:22px;color:#111;",text:"🛠️ Site tools"}),
          btn("✕","#fff",close)
        ]),
        p("Only manager, admin and master accounts can see this."),
        exportSection(),
        buildsSection()
      ]);
      root=el("div",{style:"position:fixed;inset:0;z-index:1000;background:rgba(17,17,17,.45);display:flex;align-items:center;justify-content:center;padding:12px;",onclick:close},[panel]);
      document.body.appendChild(root);
      document.addEventListener("keydown",onKey);
    };
  })();
  </script>
