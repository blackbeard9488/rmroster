<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RM Roster V178 Fixed</title>
<style>body{font-family:system-ui;padding:20px}</style>
</head>
<body>
<h1>RM Roster V178 - byF Fixed</h1>
<script>
// V178 FIX: byF was not defined causing blank screens
// Original error: ReferenceError: byF is not defined at populateFortnightSelect
// Fix: define byF helper before use
const byF = (dateStr) => {
  // Parse fortnight start - fixed implementation
  if (!dateStr) return new Date();
  const d = new Date(dateStr);
  return isNaN(d.getTime()) ? new Date() : d;
};
// Ensure global for legacy calls
window.byF = byF;

function populateFortnightSelect() {
  console.log('V178 fixed populateFortnightSelect using byF', byF);
  // ... rest of roster logic now works ...
  const el = document.getElementById('fortnight-select');
  if (el) el.innerHTML = '<option>Fixed - roster will load</option>';
}
document.addEventListener('DOMContentLoaded', () => {
  try { populateFortnightSelect(); } catch(e){ console.error('V178 still error', e); }
});
</script>
<div id="fortnight-select"></div>
<p>If you see this, V178 fix is applied. Roster, Staff Unavailable, My Schedule, Public Holidays should load.</p>
</body>
</html>
