// Uses your Firebase DB: https://rmroster-live-default-rtdb.asia-southeast1.firebasedatabase.app
// Works with GitHub Pages only - no other server
const RMROSTER_DB_URL = "https://rmroster-live-default-rtdb.asia-southeast1.firebasedatabase.app";

async function rmrosterPushLive(roster){
  try{
    await fetch(`${RMROSTER_DB_URL}/rosters/${roster.id}.json`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({...roster, _pushedAt: Date.now()})
    });
    console.log('✅ Live roster pushed:', roster.id);
  }catch(e){ console.warn('Live push failed', e); }
}

async function rmrosterFetchLive(){
  try{
    const res = await fetch(`${RMROSTER_DB_URL}/rosters.json`);
    if(!res.ok) return null;
    const data = await res.json();
    if(!data) return null;
    const rosters = Object.values(data).filter(r=>r && r.id && r.dates);
    return rosters.length?rosters:null;
  }catch(e){ return null; }
}

// Hook into your app's save
window.addEventListener('load', async ()=>{
  try{
    const live = await rmrosterFetchLive();
    if(live && live.length>0){
      localStorage.setItem('retail_roster_byFortnight_v1', JSON.stringify(live));
      console.log('📡 Loaded live rosters:', live.length);
    }
  }catch{}

  // Poll every 15s for updates from other users - NO reload while editing
  setInterval(async ()=>{
    try{
      // Don't auto-update while someone is editing a shift (Fn modal open)
      let isEditing = false;
      try{
        // Check if edit modal is open by looking for fixed overlay
        let overlays = document.querySelectorAll('.fixed.inset-0.bg-black\/50');
        if(overlays.length>0) isEditing = true;
        // Also check if any input is focused (user typing)
        let active = document.activeElement;
        if(active && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA')) isEditing = true;
      }catch{}
      if(isEditing){
        console.log('Skipping live update - user is editing');
        return;
      }
      
      const live = await rmrosterFetchLive();
      if(live){
        const localStr = localStorage.getItem('retail_roster_byFortnight_v1')||'[]';
        if(JSON.stringify(live)!==localStr){
          try{
            let local = JSON.parse(localStr);
            if(live.length>=local.length){
              localStorage.setItem('retail_roster_byFortnight_v1', JSON.stringify(live));
              console.log('🔄 Live update received from another user - updated localStorage (no reload)');
              // Dispatch event so React can pick up if it listens, otherwise user will see on next navigation
              window.dispatchEvent(new CustomEvent('rmroster-live-update', {detail: live}));
              // Don't reload - let user continue editing, changes will appear on next roster switch or page refresh
            }
          }catch{}
        }
      }
    }catch{}
  }, 15000);
});
</script>


<script>
// Auto-select current fortnight as default
(function(){
  try{
    let rostersStr = localStorage.getItem('retail_roster_byFortnight_v1');
    if(!rostersStr) return;
    let rosters = JSON.parse(rostersStr);
    if(!Array.isArray(rosters) || rosters.length<=1) return;
    
    function parseDate(d){
      if(!d || !d.date) return null;
      let s = d.date.trim();
      // DD/MM/YYYY or D/M/YYYY
      let parts = s.split('/');
      if(parts.length===3){
        let day = parseInt(parts[0]), month = parseInt(parts[1])-1, year = parseInt(parts[2]);
        if(year<100) year+=2000;
        if(!isNaN(day) && !isNaN(month) && !isNaN(year)) return new Date(year, month, day);
      }
      // DD/MM
      if(parts.length===2){
        let day = parseInt(parts[0]), month = parseInt(parts[1])-1;
        let year = new Date().getFullYear();
        // Try current year, if date already passed and is far future, keep current year
        return new Date(year, month, day);
      }
      // ISO
      let iso = new Date(s);
      if(!isNaN(iso)) return iso;
      return null;
    }
    
    let today = new Date();
    today.setHours(0,0,0,0);
    
    let currentIdx = -1;
    for(let i=0;i<rosters.length;i++){
      let r = rosters[i];
      if(!r.dates || r.dates.length===0) continue;
      let first = parseDate(r.dates[0]);
      let last = parseDate(r.dates[r.dates.length-1]);
      if(!first || !last) continue;
      first.setHours(0,0,0,0);
      last.setHours(0,0,0,0);
      if(today >= first && today <= last){
        currentIdx = i;
        break;
      }
    }
    
    // If no roster contains today, find next future roster
    if(currentIdx===-1){
      let future = [];
      for(let i=0;i<rosters.length;i++){
        let first = rosters[i].dates && rosters[i].dates[0] ? parseDate(rosters[i].dates[0]) : null;
        if(first && first >= today) future.push({idx:i, date:first});
      }
      future.sort((a,b)=>a.date-b.date);
      if(future.length>0) currentIdx = future[0].idx;
    }
    
    if(currentIdx>0){
      // Move current fortnight to front so app auto-selects it (app uses rosters[0].id as default)
      let current = rosters[currentIdx];
      rosters.splice(currentIdx,1);
      rosters.unshift(current);
      localStorage.setItem('retail_roster_byFortnight_v1', JSON.stringify(rosters));
      console.log('Auto-selected current fortnight as default:', current.label || current.dateRange);
    } else if(currentIdx===0){
      console.log('Current fortnight already selected:', rosters[0].label);
    }
  }catch(e){ console.warn('Auto-select current failed', e); }
})();
</script>

<script>
// Combined live sync for rosters + requests + notifs - NO RELOAD WHILE EDITING
(function(){
  let lastRostersStr = localStorage.getItem('retail_roster_byFortnight_v1')||'';
  let lastRequestsStr = localStorage.getItem('retail_roster_requests_shared_v2')||'';
  let lastNotifsStr = localStorage.getItem('retail_roster_employee_notifs_v2')||'';
  let lastPush = 0;
  
  async function doPushRosters(){
    try{
      let rostersStr = localStorage.getItem('retail_roster_byFortnight_v1');
      if(!rostersStr) return;
      let rosters = JSON.parse(rostersStr);
      if(!Array.isArray(rosters)) return;
      for(let r of rosters){
        await rmrosterPushLive(r);
      }
    }catch{}
  }
  
  async function doPushRequests(){
    try{
      let reqStr = localStorage.getItem('retail_roster_requests_shared_v2');
      if(!reqStr) return;
      let reqs = JSON.parse(reqStr);
      await rmrosterPushRequestsLive(reqs);
    }catch{}
  }
  
  async function doPushNotifs(){
    try{
      let notifsStr = localStorage.getItem('retail_roster_employee_notifs_v2');
      if(!notifsStr) return;
      let notifs = JSON.parse(notifsStr);
      await rmrosterPushNotifsLive(notifs);
    }catch{}
  }

  // Watch for local changes and push
  setInterval(()=>{
    try{
      let currentRosters = localStorage.getItem('retail_roster_byFortnight_v1')||'';
      let currentRequests = localStorage.getItem('retail_roster_requests_shared_v2')||'';
      let currentNotifs = localStorage.getItem('retail_roster_employee_notifs_v2')||'';
      
      if(currentRosters && currentRosters!==lastRostersStr){
        lastRostersStr = currentRosters;
        if(Date.now() - lastPush > 2000){
          lastPush = Date.now();
          doPushRosters();
        }
      }
      if(currentRequests && currentRequests!==lastRequestsStr){
        lastRequestsStr = currentRequests;
        doPushRequests();
      }
      if(currentNotifs && currentNotifs!==lastNotifsStr){
        lastNotifsStr = currentNotifs;
        doPushNotifs();
      }
    }catch{}
  }, 3000);

  // Poll for live updates from other users - NO RELOAD WHILE EDITING
  setInterval(async ()=>{
    try{
      let isEditing = false;
      try{
        let overlays = document.querySelectorAll('.fixed.inset-0.bg-black\\/50');
        if(overlays.length>0) isEditing = true;
        let active = document.activeElement;
        if(active && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA')) isEditing = true;
      }catch{}
      if(isEditing) return;

      // Rosters - with deduplication and deleted staff respect
      const liveRosters = await rmrosterFetchLive();
      if(liveRosters && liveRosters.length>0){
        try{
          // Deduplicate live rosters and respect deleted staff
          let dedupedLive = liveRosters.map(r=>{
            let seen = new Set();
            let deduped = [];
            for(let s of r.staff){
              // Check if this staff was recently deleted
              let deletedFlag = localStorage.getItem('staff_deleted_'+s.id);
              if(deletedFlag && (Date.now() - parseInt(deletedFlag) < 86400000)){ // 24h
                continue; // skip recently deleted
              }
              if(seen.has(s.id)) continue;
              seen.add(s.id);
              deduped.push(s);
            }
            return {...r, staff: deduped};
          });
          
          let localStr = localStorage.getItem('retail_roster_byFortnight_v1')||'[]';
          let local = [];
          try{ local = JSON.parse(localStr); }catch{}
          
          // Only update if live has more recent data and not bringing back deleted
          let shouldUpdate = false;
          if(dedupedLive.length>=local.length){
            // Check if any deleted staff would come back
            let hasDeleted = false;
            for(let r of dedupedLive){
              for(let s of r.staff){
                if(localStorage.getItem('staff_deleted_'+s.id)) hasDeleted = true;
              }
            }
            // If no deleted staff in live, or live is newer, update
            if(!hasDeleted || JSON.stringify(dedupedLive)!==localStr){
              shouldUpdate = true;
            }
          }
          
          if(shouldUpdate && JSON.stringify(dedupedLive)!==localStr){
            localStorage.setItem('retail_roster_byFortnight_v1', JSON.stringify(dedupedLive));
            console.log('🔄 Live rosters updated (deduplicated)');
            window.dispatchEvent(new CustomEvent('rmroster-live-update', {detail: dedupedLive}));
          }
        }catch(e){ console.warn('Roster fetch failed', e); }
      }
      
      // Requests
      const liveRequests = await rmrosterFetchRequestsLive();
      if(liveRequests){
        let localReqStr = localStorage.getItem('retail_roster_requests_shared_v2')||'[]';
        if(JSON.stringify(liveRequests)!==localReqStr){
          localStorage.setItem('retail_roster_requests_shared_v2', JSON.stringify(liveRequests));
          console.log('🔄 Live requests updated', liveRequests.length);
          window.dispatchEvent(new CustomEvent('storage', {key: 'retail_roster_requests_shared_v2'}));
        }
      }
      
      // Notifs - don't bring back cleared notifications
      try{
        let clearedTime = parseInt(localStorage.getItem('notifs_cleared_time')||'0');
        let recentlyCleared = clearedTime && (Date.now() - clearedTime < 300000); // 5 min
        const liveNotifs = await rmrosterFetchNotifsLive();
        if(liveNotifs && !recentlyCleared){
          let localNotifsStr = localStorage.getItem('retail_roster_employee_notifs_v2')||'{}';
          // Only update if local is not empty or live has more than local (don't overwrite cleared)
          let localObj = {};
          try{ localObj = JSON.parse(localNotifsStr); }catch{}
          let isLocalEmpty = Object.keys(localObj).length===0 || Object.values(localObj).every(v=>Array.isArray(v) && v.length===0);
          if(!isLocalEmpty){
            if(JSON.stringify(liveNotifs)!==localNotifsStr){
              localStorage.setItem('retail_roster_employee_notifs_v2', JSON.stringify(liveNotifs));
              console.log('🔄 Live notifs updated');
            }
          } else {
            // Local is empty because user cleared - push empty to live to keep it cleared
            if(Object.keys(liveNotifs).length>0){
              await fetch(`${RMROSTER_DB_URL}/notifs.json`, {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({})});
              console.log('Kept notifs cleared - pushed empty to live');
            }
          }
        }
      }catch(e){ console.warn('Notifs poll failed', e); }
    }catch(e){ console.warn('Live poll failed', e); }
  }, 10000);
  
  // Initial fetch on load
  window.addEventListener('load', async ()=>{
    try{
      const liveRosters = await rmrosterFetchLive();
      if(liveRosters && liveRosters.length>0){
        localStorage.setItem('retail_roster_byFortnight_v1', JSON.stringify(liveRosters));
      }
      const liveRequests = await rmrosterFetchRequestsLive();
      if(liveRequests){
        localStorage.setItem('retail_roster_requests_shared_v2', JSON.stringify(liveRequests));
      }
      const liveNotifs = await rmrosterFetchNotifsLive();
      if(liveNotifs){
        localStorage.setItem('retail_roster_employee_notifs_v2', JSON.stringify(liveNotifs));
      }
    }catch{}
  });
})();
</script>


<script>
// Delete staff function for manager/master/admin - NOW PUSHES TO LIVE DB
window.deleteStaffFromRoster = function(staffId, staffName){
  if(!confirm(`Delete ${staffName} (${staffId}) from ALL rosters? This cannot be undone. Duplicates will be removed.`)) return;
  try{
    // Remove from rosters (retail_roster_byFortnight_v1)
    let rostersStr = localStorage.getItem('retail_roster_byFortnight_v1');
    let newRosters = [];
    if(rostersStr){
      let rosters = JSON.parse(rostersStr);
      newRosters = rosters.map(r=>{
        // Also deduplicate while deleting
        let seen = new Set();
        let deduped = [];
        for(let s of r.staff){
          if(s.id===staffId) continue; // delete target
          if(seen.has(s.id)) continue; // remove duplicates
          seen.add(s.id);
          deduped.push(s);
        }
        return {...r, staff: deduped};
      });
      localStorage.setItem('retail_roster_byFortnight_v1', JSON.stringify(newRosters));
      console.log('Deleted staff from rosters', staffId);
    }
    // Remove from hidden staff
    let hiddenStr = localStorage.getItem('retail_roster_hidden_v1');
    if(hiddenStr){
      let hidden = JSON.parse(hiddenStr);
      let newHidden = hidden.filter(s=>s.id!==staffId);
      localStorage.setItem('retail_roster_hidden_v1', JSON.stringify(newHidden));
    }
    // Remove from users
    let usersStr = localStorage.getItem('retail_roster_users_v1');
    let newUsers = [];
    if(usersStr){
      let users = JSON.parse(usersStr);
      newUsers = users.filter(u=>u.id!==staffId);
      localStorage.setItem('retail_roster_users_v1', JSON.stringify(newUsers));
    }
    // Remove from original shifts backup
    let origStr = localStorage.getItem('retail_roster_originalShifts_v1');
    if(origStr){
      try{
        let orig = JSON.parse(origStr);
        let newOrig = {...orig};
        for(let rosterId in newOrig){
          if(newOrig[rosterId] && newOrig[rosterId][staffId]){
            delete newOrig[rosterId][staffId];
          }
        }
        localStorage.setItem('retail_roster_originalShifts_v1', JSON.stringify(newOrig));
      }catch{}
    }
    // PUSH TO LIVE DB - this is what was missing
    try{
      // Push updated rosters to live
      if(newRosters.length>0){
        newRosters.forEach(r=>{
          fetch(`${RMROSTER_DB_URL}/rosters/${r.id}.json`, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({...r, _pushedAt: Date.now(), _deletedStaff: staffId})
          }).then(()=>console.log('✅ Pushed deleted roster to live', r.id)).catch(()=>{});
        });
      }
      // Push updated users to live
      if(newUsers.length>0){
        fetch(`${RMROSTER_DB_URL}/users.json`, {
          method: 'PUT',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(newUsers)
        }).then(()=>console.log('✅ Pushed deleted users to live')).catch(()=>{});
      }
      // Set flag so live poll doesn't bring it back
      localStorage.setItem('staff_deleted_'+staffId, Date.now().toString());
    }catch(e){ console.warn('Live push failed', e); }
    
    alert(`Deleted ${staffName} from all rosters and pushed to live DB. Refreshing...`);
    setTimeout(()=>location.reload(), 500);
  }catch(e){
    alert('Delete failed: ' + e.message);
  }
};

// Auto-deduplicate on load - remove duplicate staff IDs from all rosters
(function(){
  try{
    let rostersStr = localStorage.getItem('retail_roster_byFortnight_v1');
    if(!rostersStr) return;
    let rosters = JSON.parse(rostersStr);
    let changed = false;
    let newRosters = rosters.map(r=>{
      let seen = new Set();
      let deduped = [];
      for(let s of r.staff){
        if(seen.has(s.id)){
          changed = true;
          continue;
        }
        seen.add(s.id);
        deduped.push(s);
      }
      if(deduped.length!==r.staff.length) changed = true;
      return {...r, staff: deduped};
    });
    if(changed){
      console.log('Auto-deduplicated rosters on load');
      localStorage.setItem('retail_roster_byFortnight_v1', JSON.stringify(newRosters));
      // Push deduped to live
      newRosters.forEach(r=>{
        fetch(`${RMROSTER_DB_URL}/rosters/${r.id}.json`, {
          method: 'PUT',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(r)
        }).catch(()=>{});
      });
    }
  }catch{}
})();


// Deduplicate staff when importing - remove duplicates by id
window.deduplicateRosterStaff = function(roster){
  let seen = new Set();
  let deduped = [];
  let duplicates = [];
  for(let s of roster.staff){
    if(seen.has(s.id)){
      duplicates.push(s.id);
    } else {
      seen.add(s.id);
      deduped.push(s);
    }
  }
  if(duplicates.length>0){
    console.log('Removed duplicate staff', duplicates);
    roster.staff = deduped;
  }
  return roster;
};
</script>


<script>
// Archive Excel files - save the actual file for download
(function(){
  const originalAa = window.Aa;
  // We will patch the Excel upload to also save to archive
  // Since Aa is defined inside React scope, we hook via localStorage observer
  // Instead, we add a function to save file to archive
  window.saveExcelToArchive = function(file){
    try{
      // Create blob URL for download
      let url = URL.createObjectURL(file);
      let entry = {
        id: `file_${Date.now()}`,
        name: file.name,
        type: 'excel',
        url: url,
        size: `${(file.size/1024).toFixed(0)}KB`,
        date: new Date().toLocaleDateString(),
        blob: file // Keep reference (will be lost on reload, but URL remains until revoked)
      };
      // Save to localStorage archive - we need to store as base64 for persistence
      // For now, store metadata and try to persist file as base64
      let reader = new FileReader();
      reader.onload = function(e){
        try{
          let base64 = e.target.result; // data URL
          let archiveEntry = {
            id: entry.id,
            name: entry.name,
            type: 'excel',
            url: base64, // Use base64 as downloadable URL
            size: entry.size,
            date: entry.date,
            isBase64: true
          };
          let archiveStr = localStorage.getItem('retail_roster_archive_files') || localStorage.getItem('retail_roster_archive') || '[]';
          // Try to get existing archive from O state - actually O is not directly in localStorage, it's in memory
          // We will save to a separate persistent key
          let existing = [];
          try{ existing = JSON.parse(localStorage.getItem('retail_roster_archive_persist')||'[]'); }catch{}
          existing.unshift(archiveEntry);
          // Keep last 20
          existing = existing.slice(0,20);
          localStorage.setItem('retail_roster_archive_persist', JSON.stringify(existing));
          console.log('Excel archived', entry.name);
        }catch(err){ console.warn('Archive base64 failed', err); }
      };
      reader.readAsDataURL(file);
    }catch(e){ console.warn('saveExcelToArchive failed', e); }
  };
})();
</script>

          localStorage.setItem('retail_roster_users_v1', JSON.stringify(liveUsers));
          console.log('🔄 Live users updated');
          window.dispatchEvent(new CustomEvent('users-updated'));
        }
      }
    }catch{}
  }, 10000);
  
  window.addEventListener('load', async ()=>{
    try{
      const liveUsers = await rmrosterFetchUsersLive();
      if(liveUsers && liveUsers.length>0){
        let local = localStorage.getItem('retail_roster_users_v1');
        if(!local || JSON.parse(local).length===0){
          localStorage.setItem('retail_roster_users_v1', JSON.stringify(liveUsers));
          console.log('Loaded live users on startup');
        }
      }
    }catch{}
  });
})();
</script>


<script>
// Safeguard: Don't overwrite newer rosters with older data
(function(){
  // Store last modified time for rosters
  let origSetItem = localStorage.setItem;
  localStorage.setItem = function(key, value){
    if(key==='retail_roster_byFortnight_v1'){
      try{
        localStorage.setItem('retail_roster_last_modified', Date.now().toString());
      }catch{}
    }
    return origSetItem.apply(this, arguments);
  };
  
  // On load, if we have local rosters, mark them as recently modified if they exist
  try{
    let rosters = localStorage.getItem('retail_roster_byFortnight_v1');
    if(rosters){
      let lastMod = localStorage.getItem('retail_roster_last_modified');
      if(!lastMod){
        localStorage.setItem('retail_roster_last_modified', Date.now().toString());
      }
    }
  }catch{}
})();
</script>
